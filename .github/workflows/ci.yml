name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app ml scripts tests
      - run: python -m ruff format --check app ml scripts tests
      - run: python -m pytest -q

  ml:
    name: ML (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ml.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/smoke_pipeline.py

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_browser.py

  docker:
    name: Docker (light web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker build --target web -t face-lab:ci .
      - name: Verify container
        shell: bash
        run: |
          docker run -d --name face-lab-ci -p 127.0.0.1:8000:8000 face-lab:ci
          trap 'docker logs face-lab-ci; docker rm -f face-lab-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/demo/ > /tmp/demo.json
          python -c "import json; assert json.load(open('/tmp/health.json'))['status'] == 'ok'; assert json.load(open('/tmp/demo.json'))['mode'] == 'demo'"
          test "$(docker exec face-lab-ci id -u)" != '0'
          docker exec face-lab-ci python -c "from importlib.util import find_spec; assert find_spec('torch') is None"

  release:
    name: Publish source release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [tests, ml, browser, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          archive="Face-Lab-${RELEASE_TAG#v}-source.zip"
          git archive --format=zip --prefix=Face-Lab/ HEAD > "dist/$archive"
          (cd dist && sha256sum "$archive" > SHA256SUMS)
          gh release create "$RELEASE_TAG" "dist/$archive" dist/SHA256SUMS --verify-tag --title "Face Lab ${RELEASE_TAG#v}" --notes-file docs/release-notes.md
